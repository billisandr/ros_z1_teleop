# =====================================================================
# 3D hand and finger tracking - configuration
# Every setting below has a matching default inside hand_tracker_3d.py,
# so you can delete any key you do not care about.
# =====================================================================

# ----- Input -----
input:
  source: 0              # webcam index (0, 1, ...) OR path to a video file "clip.mp4"
  max_frames: 0          # 0 means no limit
  frame_stride: 1        # process every Nth frame (2 = skip every other frame)
  flip_horizontal: true  # mirror a webcam feed so motion reads naturally

# ----- Camera intrinsics (used when lifting 2D landmarks to 3D) -----
# Leave any value null to approximate it from the frame size.
camera:
  fx: null
  fy: null
  cx: null
  cy: null

# ----- MediaPipe Hands -----
hands:
  max_num_hands: 2
  model_complexity: 1            # 0 (fast) or 1 (accurate)
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.6

# ----- Full arm tracking (TOGGLE: track the arm like a 6-DOF robot arm) -----
# Uses MediaPipe Pose to track shoulder, elbow, and wrist, stitches the hand
# onto the wrist, and decomposes the chain into 6 joint angles:
#   q1 shoulder azimuth, q2 shoulder elevation, q3 humeral rotation,
#   q4 elbow flexion, q5 wrist flexion, q6 wrist deviation.
# For the cleanest combined arm + hand 3D, also enable depth_anything.
arm:
  enabled: false
  side: "right"                  # left | right | both
  model_complexity: 1            # 0, 1, or 2 (2 is most accurate, slowest)
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  min_visibility: 0.5            # drop the arm if shoulder/elbow/wrist are occluded
  compute_joint_angles: true     # report the 6-DOF angles
  draw_arm: true                 # draw shoulder-elbow-wrist sticks and beads
  stitch_to_hand: true           # connect the arm wrist to the hand skeleton
  show_angles: true              # print the live angle readout on the 3D plot

# ----- Depth Anything V2 (TOGGLE: the 3D depth source) -----
# off -> z comes from MediaPipe world landmarks (metric, hand-centred shape)
# on  -> z comes from a per-pixel Depth Anything map (captures real translation)
depth_anything:
  enabled: false
  model: "depth-anything/Depth-Anything-V2-Small-hf"
  # For true metres use a metric checkpoint and set metric: true, e.g.
  #   "depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf"
  metric: false
  device: "cuda"        # "cuda" or "cpu"
  infer_every: 1        # run the depth net every N processed frames (cache between)
  invert: true          # relative models give larger=closer, invert so larger=farther
  scale: 0.5            # map normalised depth into plot units
  shift: 0.2            # push the hand this far in front of the camera
  sample_window: 2      # half-width of the median window sampled at each landmark

# ----- Open-vocabulary localisation (TOGGLE + selectable backend) -----
# off       -> MediaPipe runs on the full frame
# on        -> the chosen backend finds the hand region first, MediaPipe runs in it
# backend   -> "grounding_dino" (turnkey, recommended) OR "locateanything"
localize:
  enabled: false
  backend: "grounding_dino"     # grounding_dino | locateanything
  prompt: "hand"
  device: "cuda"
  detect_every: 5               # re-localise every N processed frames
  pad: 0.25                     # grow the detected box by this fraction before cropping
  min_box: 24                   # ignore boxes smaller than this many pixels
  grounding_dino:
    model: "IDEA-Research/grounding-dino-tiny"   # or grounding-dino-base
    box_threshold: 0.30
    text_threshold: 0.25
  locateanything:
    model: "nvidia/LocateAnything-3B"

# ----- Landmark smoothing across frames -----
smoothing:
  method: "oneeuro"     # none | ema | oneeuro
  ema_alpha: 0.5
  oneeuro_min_cutoff: 1.2
  oneeuro_beta: 0.03

# ----- 3D fallback used only when Depth Anything is off -----
fallback:
  z_nominal: 0.6        # nominal hand distance (plot units)

# ----- Visualisation -----
view:
  live: false           # true -> update a 3D window in real time while processing
  mode: "animate"       # animate | save | show_last | none  (runs after processing)
  elev: 18
  azim: -70
  fps: 20
  trail: 12             # fingertip trail length in frames (0 disables)
  fixed_limits: null    # [[xmin,xmax],[ymin,ymax],[zmin,zmax]] or null for auto
  point_size: 40
  line_width: 2.5

# ----- Output -----
output:
  video_path: null      # "hand_3d.mp4" (needs ffmpeg) or "hand_3d.gif"
  save_landmarks: null  # "landmarks.npz" to dump the raw 3D trajectory
  overlay_window: true  # show the live 2D camera view with landmarks while processing
