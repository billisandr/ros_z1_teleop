# =============================================================================
# Z1 Hand-Teleop Station — Configuration
# =============================================================================
# Edit this file and rebuild (or docker cp) to change behaviour.
# All values are loaded at launch time via the ROS parameter server.
#
# Pipeline:  camera image -> hand_detector_node -> /hand/target_pose (+active,
# +gripper) -> arm_tracker_node -> Gazebo Z1 joint controllers.
#
# Default control law = Cartesian "hand mirror": the tracked hand point's
# normalized image coords (u,v) map linearly to a world Y/Z target with X held
# fixed. No camera calibration, no TF, no depth.
# =============================================================================


# -----------------------------------------------------------------------------
# Control mode
# -----------------------------------------------------------------------------
control:
  # cartesian    — image (u,v) -> world (Y,Z), X fixed (default, recommended)
  # joint_mirror — MediaPipe Pose -> 6 arm angles, off by default; see docs/JOINT_MIRROR.md
  mode: cartesian


# -----------------------------------------------------------------------------
# MediaPipe Hands (perception)
# -----------------------------------------------------------------------------
hand:
  model_complexity: 1            # 0 = fastest, 1 = more accurate
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.6
  # Mirror the feed (selfie view) so MediaPipe's handedness labels match the
  # operator's real hand — "right" then means the operator's right hand.
  flip_horizontal: true
  # Where the image stream comes from (consumed by image_source_node):
  #   webcam            — open a local V4L2 device (see hand/webcam_device)
  #   video:/path.mp4   — loop a video file (zero camera hardware; great for demos)
  #   external          — another node already publishes /camera/color/image_raw
  #                       (e.g. the ZED bridge or RealSense driver) — helper idles
  image_source: webcam
  webcam_device: 0               # V4L2 index when image_source: webcam
  source_fps: 30                 # publish rate for webcam/video sources


# -----------------------------------------------------------------------------
# Image -> world mapping (Cartesian hand mirror)
# -----------------------------------------------------------------------------
mapping:
  tracked_point: wrist           # wrist | palm_centroid
  fixed_x: 0.25                  # world depth held constant (mirror arm_tracker.fixed_x)
  y_range: [-0.35, 0.35]         # world Y for image u in [0,1] (mirrored)
  z_range: [0.10, 0.75]          # world Z for image v in [0,1] (inverted)
  deadzone: 0.0                  # centered deadzone (0..0.5) to kill jitter when still
  depth_from_hand_size: false    # not implemented yet — X stays fixed when false


# -----------------------------------------------------------------------------
# Hand-tracking conventions (the operator interaction rules; see the README's
# "Operator conventions" section)
# -----------------------------------------------------------------------------
gesture:
  hand: right                    # right | left | either
  clutch: palm_fist              # palm_fist | always_on | pinch_hold
  gripper: pinch                 # pinch | none   (v1 default ON)
  lost_frames: 10                # frames without the hand before freezing
  hysteresis_frames: 3           # consecutive frames to flip the clutch state
  open_fingers: 4                # >= this many extended fingers -> ENGAGE
  fist_fingers: 1                # <= this many extended fingers -> FREEZE
  pinch_hold_dist: 0.06          # thumb-index distance below which pinch_hold engages
  pinch_closed_dist: 0.03        # pinch distance mapped to gripper = closed (0)
  pinch_open_dist: 0.18          # pinch distance mapped to gripper = open  (1)


# -----------------------------------------------------------------------------
# Target smoothing — OneEuro on the normalized (u,v) before mapping
# -----------------------------------------------------------------------------
smoothing:
  freq: 30.0                     # nominal frame rate (Hz)
  min_cutoff: 1.0                # lower = smoother but laggier
  beta: 0.0                      # higher = less lag during fast motion


# -----------------------------------------------------------------------------
# Joint-mirror mode (control/mode: joint_mirror) — see docs/JOINT_MIRROR.md
# -----------------------------------------------------------------------------
# Drives the Z1 joints DIRECTLY from the operator's arm pose (MediaPipe Pose:
# shoulder -> elbow -> wrist), bypassing IK. Lower precision than the default
# cartesian hand-mirror and harder to bound, so it is OFF by default and gated
# behind control/mode. The operator's UPPER BODY (shoulders + hips) must be in
# frame, not just the hand. The hand clutch (open palm / fist) still gates motion.
#
# STAGE 1 (default): joints 1-3 (base yaw, shoulder lift, elbow) are driven; the
# wrist joints 4-6 are held until you tune them (set their `enabled` to true).
#
# The detector publishes the 6 human arm angles in DEGREES on /hand/joint_targets
#   [q1..q6] = [shoulder_azimuth, shoulder_elevation, humeral_rotation,
#               elbow_flexion, wrist_flexion, wrist_deviation]
# and the arm tracker remaps each Z1 joint from one of them, then clamps to
# joint_limits. Per-joint map entry: [human_src_index(0-5), sign, scale, offset_deg, enabled].
# These defaults are directionally sensible but EXPECT live tuning in Gazebo
# (adjust sign/scale/offset); joint_limits clamping keeps it safe regardless.
joint_mirror:
  pose_side: right                       # which arm to track: left | right
  pose_model_complexity: 1               # 0 = fastest, 1 = balanced, 2 = most accurate
  pose_min_detection_confidence: 0.6
  pose_min_tracking_confidence: 0.6
  min_visibility: 0.5                    # require shoulder/elbow/wrist visibility, else freeze
  smoothing_alpha: 0.12                  # low-pass on joint targets (0=frozen, 1=instant)

  #            [src, sign, scale, offset_deg, enabled]
  map_joint1:  [0,  1.0,  1.0,    0.0,  true ]   # base yaw    <- shoulder azimuth
  map_joint2:  [1,  1.0,  1.0,   90.0,  true ]   # shoulder    <- shoulder elevation (-90..90 -> 0..180)
  map_joint3:  [3, -1.0,  1.0,    0.0,  true ]   # elbow       <- elbow flexion (0=straight)
  map_joint4:  [2,  1.0,  1.0,    0.0,  false]   # wrist roll  <- humeral rotation
  map_joint5:  [4,  1.0,  1.0,    0.0,  false]   # wrist pitch <- wrist flexion
  map_joint6:  [5,  1.0,  1.0,    0.0,  false]   # wrist yaw   <- wrist deviation


# -----------------------------------------------------------------------------
# Camera (generic; debug overlay toggle)
# -----------------------------------------------------------------------------
camera:
  width: 640
  height: 480
  fps: 30
  # Publish the landmark + HUD overlay on /hand/debug_image
  show_debug_image: true


# -----------------------------------------------------------------------------
# ZED 2 Camera Bridge (real-camera mode — used by z1_teleop_zed.launch)
# -----------------------------------------------------------------------------
# Reads the ZED 2's raw UVC side-by-side stereo feed directly (no ZED SDK) and
# republishes one eye on /camera/color/image_raw — hand_detector_node is unaware
# of which camera feeds it. Intrinsics are a rough FOV estimate, not factory
# calibration (the default hand-mirror mapping does not use them anyway).
#
# On Windows + usbipd, isochronous USB-over-IP corrupts high-bandwidth video.
# Confirm width/height/fps are clean with ffplay BEFORE trusting this node —
# see docs/DOCKER_CMDS.md#diagnosing-corruptedgarbled-video-over-usbipd-windows.
zed_camera:
  device: /dev/video0
  # 1344x376@15fps is the ZED 2's lowest-bandwidth mode and the only one
  # confirmed corruption-free over usbipd.
  width: 1344
  height: 376
  fps: 15
  eye: left                      # which half of the side-by-side frame to publish
  hfov_deg: 110.0                # ZED 2 wide-lens spec — rough intrinsics only


# -----------------------------------------------------------------------------
# Arm Tracker (control) — IK, smoothing, clamp, gripper passthrough
# -----------------------------------------------------------------------------
arm_tracker:
  # Rate at which joint commands are published (Hz). Max ~50.
  update_rate: 50.0

  # Fixed forward reach (metres, world X) maintained during 2D tracking.
  # Should match mapping/fixed_x. The arm only follows the hand's Y and Z.
  fixed_x: 0.25

  # Low-pass filter coefficient for the Cartesian target (0.0=frozen, 1.0=instant).
  # Lower = slower, smoother arm motion.
  smoothing_alpha: 0.10

  # Offset applied on top of fixed_x / hand Y,Z before sending to the arm (metres).
  target_offset: [0.0, 0.0, 0.0]

  # Safe workspace limits for the end-effector (metres, world frame). Clamped.
  workspace:
    x: [0.20, 0.65]
    y: [-0.40, 0.40]
    z: [0.10, 0.75]

  # Joint PD gains stamped into every MotorCmd.
  joint_kp: 150.0
  joint_kd: 3.0

  # If false, the tracker loads but sends no commands (detection-only testing).
  enabled: true

  # --- Gripper passthrough (pinch -> gripper) ---
  enable_gripper: true
  gripper_closed_angle: 0.0      # jointGripper rad at gripper_cmd=0 (closed)
  gripper_open_angle: -1.5708    # jointGripper rad at gripper_cmd=1 (open, -pi/2)

  # --- Wrist orientation tracking ---
  # When true, wrist joints (4-6) rotate to face the target once the arm settles.
  track_orientation: false
  orientation_alpha: 0.10
  stability_threshold: 0.010     # max position change per tick (m) to count as stable
  stability_ticks: 15            # consecutive stable ticks before the wrist engages


# -----------------------------------------------------------------------------
# Z1 Joint Limits (radians; degree equivalents in comments)
# -----------------------------------------------------------------------------
joint_limits:
  j1: [-2.618,  2.618]   # ±150 deg  — base rotation
  j2: [ 0.000,  3.142]   #  0–180 deg — shoulder lift
  j3: [-2.880,  0.000]   # -165–0 deg — elbow
  j4: [-1.396,  1.396]   # ±80 deg   — wrist roll
  j5: [-1.484,  1.484]   # ±85 deg   — wrist pitch
  j6: [-2.793,  2.793]   # ±160 deg  — wrist yaw


# -----------------------------------------------------------------------------
# Simulation
# -----------------------------------------------------------------------------
simulation:
  paused: true                   # start Gazebo paused (z1_unpause to release)
  gui: true
  headless: false


# -----------------------------------------------------------------------------
# Scene objects (Gazebo props) — spawned by scene_spawner_node
# -----------------------------------------------------------------------------
# A few cubes / pyramids / cylinders dropped into the world as interaction
# targets (knock them over, or try to grasp them with the gripper on). Purely
# cosmetic — they do not affect the hand tracking or control law.
#
#   enabled : MASTER true/false switch. false = clean arm-only scene.
#   static  : true = props are bolted to the floor; false = the arm can push them.
#   objects : list of props. Each prop is:
#       name  : unique Gazebo model name
#       type  : box | cylinder | pyramid
#       size  : box      -> [size_x, size_y, size_z]   (m)
#               cylinder -> [radius, length]           (m, axis = vertical)
#               pyramid  -> [base_x, base_y, height]   (m)
#       pose  : [x, y, z] world position (m). z is an OFFSET above the prop's
#               resting height, so z: 0 sits flush on the ground for any size.
#       yaw   : rotation about vertical (degrees, optional, default 0)
#       color : [r, g, b] each 0..1 (optional, default grey)
#       mass  : kg (optional, default 0.15; ignored when static)
#
# Tip: keep props inside the arm's reach (x ~ 0.30-0.55, see arm_tracker/workspace)
# if you want to interact with them. Edit + relaunch to apply (they spawn once).
scene_objects:
  enabled: true
  static: false
  objects:
    - {name: cube_red,     type: box,      size: [0.05, 0.05, 0.05], pose: [0.45,  0.18, 0.0], yaw: 20,  color: [0.85, 0.18, 0.18], mass: 0.15}
    - {name: cube_green,   type: box,      size: [0.06, 0.06, 0.06], pose: [0.40, -0.22, 0.0], yaw: -15, color: [0.20, 0.70, 0.25], mass: 0.20}
    - {name: cyl_blue,     type: cylinder, size: [0.03, 0.10],       pose: [0.52, -0.05, 0.0], color: [0.20, 0.45, 0.85], mass: 0.18}
    - {name: cyl_orange,   type: cylinder, size: [0.025, 0.08],      pose: [0.34,  0.10, 0.0], color: [0.95, 0.55, 0.10], mass: 0.12}
    - {name: pyramid_gold, type: pyramid,  size: [0.08, 0.08, 0.10], pose: [0.50,  0.27, 0.0], yaw: 30,  color: [0.95, 0.82, 0.12], mass: 0.15}
    - {name: pyramid_violet,type: pyramid, size: [0.07, 0.07, 0.09], pose: [0.30, -0.05, 0.0], color: [0.55, 0.25, 0.70], mass: 0.13}
